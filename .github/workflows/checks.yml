name: Checks and beta artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: python3 tools/validate.py --archive dist/rqblockplacements-1.0.0-beta.13.tar
      - name: Check generated language files
        run: git diff --exit-code -- application/data/lang.xml application/data/installLang.json application/resources/lang-cs.xml application/resources/lang-sk.xml application/resources/lang-pl.xml application/resources/lang-de.xml
      - uses: actions/upload-artifact@v4
        with:
          name: rqblockplacements-beta
          path: dist/
          if-no-files-found: error
